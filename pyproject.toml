[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proxmox-vm-portal"
version = "0.1.0"
description = "Portail MVP sécurisé de provisionnement Proxmox"
requires-python = ">=3.11"
dependencies = ["Flask>=3.0,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=portal --cov-report=term-missing --cov-fail-under=95"

[tool.setuptools]
packages = ["portal"]
