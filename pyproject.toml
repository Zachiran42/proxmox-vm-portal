[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proxmox-vm-portal"
version = "0.20.0"
description = "Portail Web sécurisé de provisionnement Proxmox"
requires-python = ">=3.11"
dependencies = [
    "Authlib>=1.7,<2",
    "cryptography>=46,<51",
    "Flask>=3.0,<4",
    "Flask-Migrate>=4.0,<5",
    "Flask-SQLAlchemy>=3.1,<4",
    "gunicorn>=23.0,<24",
    "psycopg[binary]>=3.2,<4",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=portal --cov-report=term-missing --cov-fail-under=95"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Keep the gate stable across Ruff releases; Bandit owns the security rules.
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
ignore_missing_imports = true
# Flask-SQLAlchemy creates Model dynamically; mypy cannot resolve that base.
disable_error_code = ["name-defined"]

[tool.setuptools]
packages = ["portal"]

[tool.setuptools.package-data]
portal = ["templates/*.html", "static/*.css", "static/*.js"]
