name: Security and quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked runtime and review tools
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps .
          python -m pip install pytest==8.4.2 pytest-cov==6.2.1 ruff==0.16.0 mypy==2.3.0 bandit==1.9.4 pip-audit==2.10.1
      - name: Test and analyze
        run: |
          pytest -q
          ruff check portal tests migrations
          mypy portal
          bandit -q -r portal
          pip-audit -r requirements.lock
      - name: Build the production image
        run: docker build --tag proxmox-vm-portal:${{ github.sha }} .

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Scan Git history
        run: >-
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --config /repo/.gitleaks.toml --no-banner
