name: Security and quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked runtime and review tools
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip install pytest==8.4.2 pytest-cov==6.2.1 ruff==0.16.0 mypy==2.3.0 bandit==1.9.4 pip-audit==2.10.1
      - name: Test and analyze
        run: |
          pytest -q
          ruff check portal tests migrations
          mypy portal
          bandit -q -r portal
          pip-audit -r requirements.lock
          bash -n deploy/scripts/*.sh deploy/testing/*.sh deploy/keycloak/*.sh deploy/password-pusher/*.sh images/packer/build.sh images/packer/scripts/*.sh
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          bash deploy/scripts/verify-release.sh "v$version"
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          python -m json.tool deploy/proxmox/acl-policy.example.json >/dev/null
      - name: Build the production image
        run: docker build --tag proxmox-vm-portal:${{ github.sha }} .

  image-factory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate the Debian Packer recipe
        run: |
          docker run --rm --entrypoint /bin/sh \
            -e PKR_VAR_proxmox_url=https://pve.example.invalid:8006/api2/json \
            -e 'PKR_VAR_proxmox_username=packer@pve!image-factory' \
            -e PKR_VAR_proxmox_token=ci-validation-only \
            -e PKR_VAR_proxmox_node=pve-a \
            -e PKR_VAR_proxmox_pool=image-factory \
            -e PKR_VAR_iso_storage_pool=local \
            -e PKR_VAR_vm_storage_pool=local-lvm \
            -e PKR_VAR_build_password=ci-validation-only \
            -e 'PKR_VAR_build_password_hash=$6$validation$hash' \
            -v "$PWD/images/packer:/workspace" -w /workspace \
            hashicorp/packer:1.14.3@sha256:0b9feae59276b3d72e2488d6884a281e3eab31f58d0ef9790e8f012846965dba \
            -c 'packer init debian-13.pkr.hcl && packer fmt -check debian-13.pkr.hcl && packer validate debian-13.pkr.hcl'

  debian-installer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate installation and non-root secret access on Debian 13
        run: bash deploy/testing/test-debian-install.sh

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Scan Git history
        run: >-
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --config /repo/.gitleaks.toml --no-banner
