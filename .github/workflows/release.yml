name: Secure release

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate the release tag and version surfaces
        run: bash deploy/scripts/verify-release.sh "$GITHUB_REF_NAME"

      - name: Select the lowercase GHCR image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: metadata
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long
            type=raw,value=latest

      - name: Build and publish the immutable image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            PORTAL_VERSION=${{ steps.metadata.outputs.version }}
            PORTAL_VCS_REF=${{ github.sha }}
            PORTAL_SOURCE=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Sign and verify the image by digest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          signing_config="$RUNNER_TEMP/cosign-signing-config.json"
          cosign signing-config create --with-default-services \
            --no-default-rekor --out "$signing_config"
          cosign sign --yes --signing-config "$signing_config" \
            "${IMAGE}@${DIGEST}"
          cosign verify --insecure-ignore-tlog=true --use-signed-timestamps \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${DIGEST}" >/dev/null

      - name: Generate the downloadable SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: proxmox-vm-portal-${{ steps.metadata.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Create and sign the release manifest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          sbom_file="proxmox-vm-portal-${VERSION}.spdx.json"
          sbom_sha256=$(sha256sum "$sbom_file" | cut -d' ' -f1)
          jq -n \
            --arg version "$VERSION" \
            --arg image "$IMAGE" \
            --arg digest "$DIGEST" \
            --arg commit "$GITHUB_SHA" \
            --arg sbom_file "$sbom_file" \
            --arg sbom_sha256 "$sbom_sha256" \
            --arg workflow "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{schema: 1, version: $version, image: $image, digest: $digest, commit: $commit, workflow: $workflow, sbom: {file: $sbom_file, sha256: $sbom_sha256}}' \
            > release-manifest.json
          signing_config="$RUNNER_TEMP/cosign-signing-config.json"
          cosign sign-blob --yes --signing-config "$signing_config" \
            --bundle release-manifest.sigstore.json release-manifest.json
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          cosign verify-blob --insecure-ignore-tlog=true \
            --use-signed-timestamps \
            --bundle release-manifest.sigstore.json \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            release-manifest.json
          install -m 0755 deploy/scripts/bootstrap-debian.sh \
            "proxmox-vm-portal-${VERSION}-install.sh"
          sha256sum "$sbom_file" release-manifest.json \
            release-manifest.sigstore.json \
            "proxmox-vm-portal-${VERSION}-install.sh" > SHA256SUMS

      - name: Publish the GitHub release and evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          assets=(
            "proxmox-vm-portal-${VERSION}.spdx.json"
            release-manifest.json
            release-manifest.sigstore.json
            "proxmox-vm-portal-${VERSION}-install.sh"
            SHA256SUMS
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag --generate-notes --title "Proxmox VM Portal ${GITHUB_REF_NAME}"
          fi

      - name: Build the autonomous Debian 13 bundle
        env:
          PORTAL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PORTAL_GITHUB_USERNAME: ${{ github.actor }}
          PORTAL_RELEASE_TAG: ${{ github.ref_name }}
        run: deploy/scripts/prepare-offline-bundle.sh "$RUNNER_TEMP/offline-release"

      - name: Attach the autonomous bundle to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP"/offline-release/* --clobber
