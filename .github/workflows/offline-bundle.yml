name: Publish offline bundle

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable release tag to complete
        required: true
        type: string

permissions: {}

concurrency:
  group: offline-bundle-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: read
    steps:
      - name: Check out the trusted bundle builder
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: builder
          fetch-depth: 0

      - name: Validate the requested immutable tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git -C builder ls-remote --exit-code --tags origin \
            "refs/tags/${RELEASE_TAG}" >/dev/null

      - name: Check out the released source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.release_tag }}
          path: source
          fetch-depth: 0

      - name: Log in to the private registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the autonomous Debian 13 bundle
        env:
          PORTAL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PORTAL_GITHUB_USERNAME: ${{ github.actor }}
          PORTAL_RELEASE_TAG: ${{ inputs.release_tag }}
          PORTAL_SOURCE_ROOT: ${{ github.workspace }}/source
        run: builder/deploy/scripts/prepare-offline-bundle.sh "$RUNNER_TEMP/offline-release"

      - name: Attach the autonomous bundle to the immutable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: >-
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP"/offline-release/*
          --clobber --repo "$GITHUB_REPOSITORY"
